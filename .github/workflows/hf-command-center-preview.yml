name: Command Center HF Docker preview contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  immutable-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install test contracts
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Validate source and independent publisher contracts
        run: python -m unittest discover -s tests -v
      - name: Build and independently verify derived immutable bundle
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.build_command_center_space import build_bundle
          from backend.source_manifest import verify
          out = Path(os.environ["RUNNER_TEMP"]) / "command-center-bundle"
          report = build_bundle(Path.cwd(), out, os.environ["SOURCE_COMMIT"])
          assert report["status"] == "SELF_CONSISTENT", report
          assert verify(out)["status"] == "SELF_CONSISTENT"
          print("source_bundle_ok", report["listed_files"], report["manifest_sha256"])
          PY
      - name: Build pinned nonroot Docker image
        run: docker build --progress plain -t szl-command-center:admission "$RUNNER_TEMP/command-center-bundle"
      - name: Run and verify exact source inside live container
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          docker run --detach --name szl-cc-admission -p 127.0.0.1:17860:7860 -e GH_TOKEN=CI_FAKE_GH_TOKEN -e HF_TOKEN=CI_FAKE_HF_TOKEN -e CLOUDFLARE_API_TOKEN=CI_FAKE_CF_TOKEN szl-command-center:admission
          python - <<'PY'
          import json, os, time, urllib.request
          url = "http://127.0.0.1:17860/api/source-manifest"
          for attempt in range(30):
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      data = json.load(response)
                  assert data["status"] == "SELF_CONSISTENT", data
                  assert data["source_revision"] == os.environ["SOURCE_COMMIT"]
                  assert data["execution_authorized"] is False
                  assert data["production_qualified"] is False
                  print("container_source_measured", data["listed_files"])
                  break
              except (OSError, ValueError):
                  if attempt == 29:
                      raise
                  time.sleep(2)
          PY
      - name: Verify public preview boundary even with injected dummy credentials
        run: |
          python - <<'PY'
          import json
          from urllib.request import urlopen
          base = "http://127.0.0.1:17860"
          with urlopen(base + "/api/estate", timeout=5) as r:
              estate = json.load(r)
          assert estate["scope"] == "public_preview"
          assert estate["summary"]["panels_total"] == 5
          assert estate["summary"]["panels_verified"] == 0
          assert not any(value["truth_state"] == "VERIFIED"
                         for value in estate["collectors"].values())
          assert all(value["reason"] == "PUBLIC_PREVIEW_PRIVILEGED_COLLECTOR_NOT_ADMITTED"
                     for value in estate["collectors"].values())
          assert "_historical_snapshot" not in estate
          with urlopen(base + "/api/verticals", timeout=5) as r:
              verticals = json.load(r)
          assert verticals["scope"] == "public_preview"
          assert len(verticals["verticals"]) == 5
          assert all(v["truth_state"] == "UNAVAILABLE" for v in verticals["verticals"])
          assert "CI_FAKE_" not in json.dumps({"estate": estate, "verticals": verticals})
          print("public_boundary_fail_closed_under_dummy_credentials")
          PY
      - name: Stop isolated container
        if: always()
        run: docker rm -f szl-cc-admission || true
